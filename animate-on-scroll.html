<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animate on scroll — sample (sparki.be stijl)</title>
<style>
  :root {
    --navy: #14243f;
    --white: #ffffff;
    --red: #e2001a;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f4f5f7;
    color: var(--navy);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }

  .spacer {
    min-height: 70vh;
    display: grid;
    place-items: center;
    color: #8a93a3;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }

  /* ---- Hero section (navy) ---- */
  .hero {
    background: var(--navy);
    color: var(--white);
    padding: 3rem 1.5rem 3.5rem;
    overflow: hidden;
  }

  .hero__inner {
    max-width: 40rem;
    margin: 0 auto;
  }

  .hero__intro {
    font-size: clamp(1.5rem, 5.5vw, 2.1rem);
    font-weight: 400;
    margin: 0 0 1.6rem;
  }

  .hero__cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--white);
    text-decoration: none;
    font-size: clamp(1.25rem, 4.5vw, 1.6rem);
    font-weight: 700;
    margin-bottom: 2.2rem;
  }

  .hero__cta .chevron {
    color: var(--red);
    font-weight: 700;
    transition: transform 0.3s var(--ease);
  }

  .hero__cta:hover .chevron { transform: translateX(6px); }

  /* ---- Image with scalloped (uitgesneden) left edge ---- */
  .photo-frame {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    aspect-ratio: 2 / 3;
    max-height: 78vh;
    background: linear-gradient(160deg, #f3c5c9 0%, #cfd8e6 45%, #b8c6b4 100%);
  }

  .photo-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    will-change: transform;
  }

  /* Twee navy cirkels die de "hap" uit de linkerrand nemen */
  .photo-frame::before,
  .photo-frame::after {
    content: "";
    position: absolute;
    left: 0;
    width: 34%;
    aspect-ratio: 1;
    background: var(--navy);
    border-radius: 50%;
    z-index: 2;
  }

  .photo-frame::before { top: 24%; transform: translateX(-50%); }
  .photo-frame::after  { top: 46%; transform: translateX(-62%); }

  /* =========================================================
     Animate-on-scroll: elementen krijgen .is-inview zodra ze
     in beeld komen (IntersectionObserver hieronder).
     ========================================================= */
  [data-aos] {
    opacity: 0;
    transition:
      opacity 0.9s var(--ease),
      transform 1.1s var(--ease),
      clip-path 1.1s var(--ease);
    transition-delay: var(--aos-delay, 0s);
  }

  [data-aos="fade-up"]    { transform: translateY(36px); }
  [data-aos="fade-right"] { transform: translateX(-36px); }

  [data-aos="reveal"] {
    clip-path: inset(100% 0 0 0 round 28px);
    transform: translateY(24px);
  }

  [data-aos="reveal"] img { transform: scale(1.18); transition: transform 1.6s var(--ease); }

  [data-aos].is-inview {
    opacity: 1;
    transform: none;
    clip-path: inset(0 0 0 0 round 28px);
  }

  [data-aos="reveal"].is-inview img { transform: scale(1); }

  @media (prefers-reduced-motion: reduce) {
    [data-aos] { opacity: 1; transform: none; clip-path: none; transition: none; }
    [data-aos="reveal"] img { transform: none; transition: none; }
  }
</style>
</head>
<body>

<div class="spacer">↓ Scroll naar beneden voor de animatie ↓</div>

<section class="hero">
  <div class="hero__inner">
    <h1 class="hero__intro" data-aos="fade-up">
      Jij verhuist je leven.&nbsp; Wij je energie. Zo simpel kan het zijn.
    </h1>

    <a class="hero__cta" href="#" data-aos="fade-up" style="--aos-delay: 0.15s">
      Zonder gedoe verhuizen. <span class="chevron">&rsaquo;</span>
    </a>

    <div class="photo-frame" data-aos="reveal" style="--aos-delay: 0.3s">
      <img src="https://picsum.photos/id/1084/900/1350" alt=""
           onerror="this.style.display='none'">
    </div>
  </div>
</section>

<div class="spacer">Scroll terug omhoog en weer naar beneden — de animatie speelt opnieuw.</div>

<section class="hero">
  <div class="hero__inner">
    <h1 class="hero__intro" data-aos="fade-right">
      Nog een blok, zelfde effect.
    </h1>
    <div class="photo-frame" data-aos="reveal" style="--aos-delay: 0.15s">
      <img src="https://picsum.photos/id/1011/900/1350" alt=""
           onerror="this.style.display='none'">
    </div>
  </div>
</section>

<div class="spacer">Einde van de demo.</div>

<script>
  // Animate on scroll: voeg .is-inview toe zodra 20% van het element
  // zichtbaar is; haal de klasse weg zodra het element volledig uit
  // beeld is, zodat de animatie opnieuw speelt bij terugscrollen.
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-inview');
      } else if (entry.intersectionRatio === 0) {
        entry.target.classList.remove('is-inview');
      }
    }
  }, { threshold: [0, 0.2] });

  document.querySelectorAll('[data-aos]').forEach((el) => observer.observe(el));
</script>

</body>
</html>
